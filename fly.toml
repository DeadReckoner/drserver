# fly.toml app configuration file generated for drserver-purple-moon-7907 on 2025-05-05T17:28:52-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'drserver-purple-moon-7907'
primary_region = 'ewr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Phase 1 of the notification scheduler runs in-process via robfig/cron.
  # Pin to exactly one machine so we don't get duplicate scans firing the
  # same notification from two workers. Auto-stop is off so the machine
  # stays warm for periodic cron ticks even when HTTP traffic is idle.
  # When Phase 2 (dedicated worker process) lands, revisit these.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1


[env]
  # Only non-secret configuration belongs here: this file is tracked in git.
  # DATABASE_URL and anon_key are Fly secrets, injected at runtime:
  #   fly secrets set DATABASE_URL=... anon_key=...

  # info, not debug: the auth path logs the full Supabase user record
  # (emails, identities, sign-in history) at debug, and logs ship to Axiom.
  LOG_LEVEL = "info"
  API_URL = "https://bbghphhkbqxbjgwqmlhd.supabase.co"
