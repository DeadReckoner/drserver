# fly.toml app configuration file generated for drserver-purple-moon-7907 on 2025-05-05T17:28:52-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'drserver-purple-moon-7907'
primary_region = 'ewr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Phase 1 of the notification scheduler runs in-process via robfig/cron.
  # Pin to exactly one machine so we don't get duplicate scans firing the
  # same notification from two workers. Auto-stop is off so the machine
  # stays warm for periodic cron ticks even when HTTP traffic is idle.
  # When Phase 2 (dedicated worker process) lands, revisit these.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1


[env]
  # DATABASE_URL and anon_key are Fly SECRETS, not [env] values.
  #
  # They previously sat here as literals, which meant a live database
  # connection string (with its password) and the Supabase anon key were
  # committed to this repository and are permanently reachable in its git
  # history. Both must be rotated; see SECRETS.md.
  #
  # Fly injects secrets into the machine environment exactly like [env]
  # entries, so the application code reading os.Getenv("DATABASE_URL") and
  # os.Getenv("anon_key") is unchanged. Set them with:
  #
  #   fly secrets set DATABASE_URL=... anon_key=...
  #
  # A deploy will start and then fail its database connection if they are
  # not set as secrets first.
  LOG_LEVEL = "debug"
  API_URL = "https://bbghphhkbqxbjgwqmlhd.supabase.co"

