  /api/v1/agent/generate-async:
    post:
      summary: Generate roadmap asynchronously with real-time progress updates
      tags: [AI Agent]
      description: |
        Starts async roadmap generation that can take 2-3 minutes. Returns immediately with job_id and roadmap_id.
        Client can:
        - Connect via WebSocket at /ws/agent/:jobid for real-time progress
        - Poll GET /jobs/:jobid/status for status updates
        - Receive push notification when complete (if token registered)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalRequest'
      responses:
        '202':
          description: Generation started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "pending"
                  job_id:
                    type: string
                    format: uuid
                    example: "123e4567-e89b-12d3-a456-426614174000"
                  roadmap_id:
                    type: string
                    format: uuid
                    example: "123e4567-e89b-12d3-a456-426614174001"
                  message:
                    type: string
                    example: "Your roadmap is being processed"
                  ws_url:
                    type: string
                    example: "ws/agent/123e4567-e89b-12d3-a456-426614174000"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/agent/generate-next-milestone-async/{milestoneid}:
    post:
      summary: Generate the next milestone asynchronously with user review feedback
      tags: [AI Agent]
      description: |
        Generates tasks (and optionally adjusts strategic fields) for a milestone
        that already exists in the roadmap but has no tasks yet. The user provides
        answers to the 7 hardcoded review questions from the mobile UI about how
        the prior milestone went; the AI uses that feedback to:

        1. Optionally adjust this milestone's strategic fields (sub_goal,
           description, acceptance_test, duration, resources_forecast, spikes,
           risks) — only when the feedback warrants it.
        2. Generate 10-14 tasks (with nested steps) tuned to the user's pacing
           and clarity preferences.

        Returns immediately with a job_id. Client subscribes to
        `/ws/agent/{jobid}` for progress. Re-invoking on the same milestone
        wipes existing tasks and replaces them with the new set.
      parameters:
        - name: milestoneid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the milestone to generate tasks for
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateNextMilestoneRequest'
      responses:
        '202':
          description: Generation started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "pending"
                  job_id:
                    type: string
                    format: uuid
                    example: "123e4567-e89b-12d3-a456-426614174000"
                  milestone_id:
                    type: string
                    format: uuid
                    example: "123e4567-e89b-12d3-a456-426614174001"
                  roadmap_id:
                    type: string
                    format: uuid
                    example: "123e4567-e89b-12d3-a456-426614174002"
                  message:
                    type: string
                    example: "Your next milestone is being generated"
                  ws_url:
                    type: string
                    example: "ws/agent/123e4567-e89b-12d3-a456-426614174000"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

