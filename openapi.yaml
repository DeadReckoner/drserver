      properties:
        description:
          type: string
          example: "Installation issues on Windows platform"
        severity:
          type: string
          enum: [low, medium, high]
          example: "medium"

    # AI Agent
    GoalRequest:
      type: object
      required:
        - goalName
        - goalDescription
      properties:
        goalName:
          type: string
          example: "Learn Full Stack Web Development"
        goalDescription:
          type: string
          example: "I want to become a full-stack developer capable of building modern web applications"
        goalImportance:
          type: string
          example: "Career advancement"
        targetCompletionDate:
          type: string
          example: "6 months"
        weeklyTimeCommitment:
          type: string
          example: "10 hours"
        workFrequency:
          type: string
          example: "Daily"
        constraints:
          type: string
          example: "Limited budget for courses"
        currentSkillLevel:
          type: string
          example: "Beginner"
        additionalContext:
          type: string
          example: "I learn best with hands-on projects"

    MilestoneReviewAnswers:
      type: object
      description: |
        User's free-form answers to the 7 hardcoded milestone-review questions
        shown in the mobile UI. All fields are optional (empty string means the
        user skipped that question). The server passes these answers to the AI
        so it can adjust the next milestone's pacing, clarity, and structure.
      properties:
        completionStatus:
          type: string
          description: "Q1: How did things go? Did they complete everything or just check off what they needed?"
          example: "Mostly completed, skipped a few tasks that felt redundant"
        whatWorked:
          type: string
          description: "Q2: What parts felt smooth, effective, or motivating?"
          example: "Short daily tasks kept me consistent"
        whatDidntWork:
          type: string
          description: "Q3: What felt confusing, difficult, unnecessary, or out of alignment?"
          example: "The theory-heavy tasks felt disconnected from the practical ones"
        obstacles:
          type: string
          description: "Q4: Obstacles encountered (practical or personal)"
          example: "Had a work trip mid-week that threw off the schedule"
        paceFeedback:
          type: string
          description: "Q5: Workload and pace — too easy, just right, or heavier than expected?"
          example: "A bit heavier than expected — I'd prefer slightly fewer tasks per day"
        clarityFeedback:
          type: string
          description: "Q6: Were the instructions clear? Which parts needed more explanation?"
          example: "Steps 2 and 3 of the 'setup environment' task needed more detail"
        goingForward:
          type: string
          description: "Q7: Preferences for next milestone + any life/priority changes"
          example: "I'd like more hands-on projects; also, I can now dedicate 15 hours/week"

    GenerateNextMilestoneRequest:
      type: object
      description: |
        Request body for POST /api/v1/agent/generate-next-milestone-async/{milestoneid}.
        Embeds all GoalRequest fields (same goal metadata as initial generation) plus
        the user's answers to the 7 milestone-review questions.
      allOf:
        - $ref: '#/components/schemas/GoalRequest'
        - type: object
          required:
            - review
          properties:
            review:
              $ref: '#/components/schemas/MilestoneReviewAnswers'

    AISession:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          example: "user123"
        status:
          type: string
          enum: [collecting, complete]
          example: "collecting"
        context:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        roadmap:
          $ref: '#/components/schemas/Roadmap'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
          example: "assistant"
        content:
          type: string
          example: "What kind of goal would you like to achieve?"

    # Background Jobs & Async Processing
    BackgroundJob:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        type:
          type: string
          enum: [roadmap_generation, milestone_generation]
          description: Type of background job
          example: "roadmap_generation"
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: Current status of the job
          example: "processing"
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Progress percentage (0-100)
          example: 45
        payload:
          type: object
          description: Input data for the job (GoalRequest for roadmap generation)
        result:
          type: object
          nullable: true
          description: Result data when job is completed
          properties:
            roadmap_id:
              type: string
              format: uuid
            macromap_id:
              type: string
              format: uuid
        error:
          type: string
          nullable: true
          description: Error message if job failed
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProgressUpdate:
      type: object
      description: WebSocket message for real-time progress updates
      properties:
        type:
          type: string
          enum: [progress, status, complete, error]
          description: Type of update message
          example: "progress"
        job_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Progress percentage
          example: 65
        status:
          type: string
          enum: [pending, processing, completed, failed]
          example: "processing"
        message:
          type: string
          description: Human-readable status message
          example: "Generating strategic roadmap..."
        data:
          type: object
          nullable: true
          description: Additional context (roadmap_id on complete, error on failure)

    # Push Notifications
    PushToken:
      type: object
      properties:
        token_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        expo_token:
          type: string
          description: Expo push notification token
          example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"
        platform:
          type: string
          enum: [ios, android]
          example: "ios"
        device_id:
          type: string
          nullable: true
          description: Optional device identifier
        is_active:
          type: boolean
          description: Whether the token is currently active
          example: true
        last_used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        notification_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        type:
          type: string
          description: Notification type
          example: "roadmap_complete"
          enum: [roadmap_complete, roadmap_failed]
        title:
          type: string
          example: "Your roadmap is ready for review!"
        body:
          type: string
          example: "Your Learn Web Development roadmap has been generated successfully."
        data:
          type: object
          nullable: true
          description: Additional payload for navigation
          properties:
            roadmap_id:
              type: string
              format: uuid
        status:
          type: string
          enum: [pending, sent, failed, read]
          description: Notification delivery and read status
          example: "sent"
        sent_at:
          type: string
          format: date-time
          nullable: true
        read_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
          description: Error message if notification failed to send
        created_at:
          type: string
          format: date-time

    Nudge:
      type: object
      properties:
        nudge_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        sender_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        receiver_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        target_type:
          type: string
          enum: [roadmap, habit]
          description: Type of target being nudged about
          example: "roadmap"
        target_id:
          type: string
          format: uuid
          description: ID of the roadmap or habit
          example: "123e4567-e89b-12d3-a456-426614174000"
        created_at:
          type: string
          format: date-time
        sender:
          $ref: '#/components/schemas/User'
        receiver:
          $ref: '#/components/schemas/User'

    # Messaging
    Thread:
      type: object
      properties:
        thread_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          nullable: true
          description: Thread name (empty for direct messages)
          example: ""
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-01T12:30:00Z"
          description: Timestamp of most recent activity

    ThreadMessage:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        thread_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        content:
          type: string
          example: "Hello, how are you?"
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T12:30:45Z"
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: "2024-01-01T12:31:00Z"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null

    # Habits Management
    Habit:
      type: object
      properties:
        habit_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        title:
          type: string
          example: "Morning meditation"
        description:
          type: string
          nullable: true
          example: "10 minutes of mindfulness"
        recurrence_type:
          type: string
          enum: [none, daily, weekly, monthly]
          description: |
            Recurrence pattern:
            - `none`: One-time todo with due_date
            - `daily`: Repeats every day
            - `weekly`: Repeats on specific days of the week
            - `monthly`: Repeats on a specific day of the month
          example: "daily"
        days_of_week:
          type: integer
          minimum: 0
          maximum: 127
          description: |
            Bitmask for days of the week (used for weekly recurrence):
            - 1 = Sunday, 2 = Monday, 4 = Tuesday, 8 = Wednesday,
            - 16 = Thursday, 32 = Friday, 64 = Saturday
            - Common values: 62 (weekdays), 65 (weekends), 127 (every day)
          example: 62
        day_of_month:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
          description: Day of month (1-31) for monthly recurrence
          example: 15
        due_date:
          type: string
          format: date-time
          nullable: true
          description: Due date for one-time todos (recurrence_type=none)
          example: "2024-04-15T00:00:00Z"
        start_date:
          type: string
          format: date-time
          description: When the habit becomes active
          example: "2024-01-01T00:00:00Z"
        end_date:
          type: string
          format: date-time
          nullable: true
          description: When the habit ends (optional)
          example: null
        archived:
          type: boolean
          description: Whether the habit is archived
          example: false
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"

    CreateHabitRequest:
      type: object
      required:
        - title
        - recurrence_type
        - start_date
      properties:
        title:
          type: string
          example: "Morning meditation"
        description:
          type: string
          example: "10 minutes of mindfulness"
        recurrence_type:
          type: string
          enum: [none, daily, weekly, monthly]
          description: Type of recurrence (none for one-time todo)
          example: "daily"
        days_of_week:
          type: integer
          minimum: 1
          maximum: 127
          description: Required for weekly recurrence (bitmask 1-127)
          example: 62
        day_of_month:
          type: integer
          minimum: 1
          maximum: 31
          description: Required for monthly recurrence (1-31)
          example: 1
        due_date:
          type: string
          format: date-time
          description: Required for one-time todos (recurrence_type=none)
          example: "2024-04-15T00:00:00Z"
        start_date:
          type: string
          format: date-time
          description: When the habit becomes active
          example: "2024-01-01T00:00:00Z"
        end_date:
          type: string
          format: date-time
          description: Optional end date for the habit
          example: null

    UpdateHabitRequest:
      type: object
      description: All fields are optional for updates
      properties:
        title:
          type: string
          example: "Evening meditation"
        description:
          type: string
          example: "15 minutes of mindfulness"
        recurrence_type:
          type: string
          enum: [none, daily, weekly, monthly]
          example: "daily"
        days_of_week:
          type: integer
          minimum: 0
          maximum: 127
          example: 127
        day_of_month:
          type: integer
          minimum: 1
          maximum: 31
          example: 15
        due_date:
          type: string
          format: date-time
          example: "2024-05-01T00:00:00Z"
        start_date:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        end_date:
          type: string
          format: date-time
          example: "2024-12-31T23:59:59Z"

    HabitCompletion:
      type: object
      properties:
        completion_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        habit_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        completed_at:
          type: string
          format: date-time
          description: Timestamp when the habit was marked complete
          example: "2024-01-15T08:30:00Z"
        date:
          type: string
          format: date
          description: The calendar date this completion counts for
          example: "2024-01-15"
        notes:
          type: string
          nullable: true
          description: Optional notes about the completion
          example: "Felt great today!"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T08:30:00Z"

    HabitWithStatus:
      type: object
      description: Habit with completion status for a specific date
      allOf:
        - $ref: '#/components/schemas/Habit'
        - type: object
          properties:
            is_completed:
              type: boolean
              description: Whether the habit is completed for the queried date
              example: true
            completed_at:
              type: string
              format: date-time
              nullable: true
              description: Timestamp when completed (null if not completed)
              example: "2024-01-15T08:30:00Z"

    HabitStats:
      type: object
      properties:
        current_streak:
          type: integer
          description: Current consecutive days the habit has been completed
          example: 7
        completion_rate_7d:
          type: number
          format: float
          description: Completion rate over the last 7 days (0.0 to 1.0)
          example: 0.857
