          description: Reply processed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            description: AI's response
                          complete:
                            type: boolean
                            description: Whether the session is complete
                          roadmap:
                            $ref: '#/components/schemas/Roadmap'
                            description: Generated roadmap (only when complete=true)
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # Background Jobs
  /api/v1/jobs/{jobid}/status:
    get:
      summary: Get background job status
      description: Poll for status of an async roadmap generation job. Use WebSocket for real-time updates instead.
      tags: [Background Jobs]
      parameters:
        - name: jobid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Job ID
      responses:
        '200':
          description: Job status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [pending, processing, completed, failed]
                  progress:
                    type: integer
                    minimum: 0
                    maximum: 100
                  created_at:
                    type: string
                    format: date-time
                  result:
                    type: object
                    description: Result data (only when status is completed)
                    properties:
                      roadmap_id:
                        type: string
                        format: uuid
                      macromap_id:
                        type: string
                        format: uuid
                  completed_at:
                    type: string
                    format: date-time
                    description: Timestamp when job completed (only when status is completed)
                  error:
                    type: string
                    description: Error message (only when status is failed)
                  failed_at:
                    type: string
                    format: date-time
                    description: Timestamp when job failed (only when status is failed)
        '404':
          $ref: '#/components/responses/NotFound'

  # Push Notifications
  /api/v1/push/tokens:
    post:
      summary: Register push notification token
      description: Register or update an Expo push notification token for the user
      tags: [Push Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expo_token
                - platform
              properties:
                expo_token:
                  type: string
                  description: Expo push token from the device
                  example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"
                platform:
                  type: string
                  enum: [ios, android]
                  description: Device platform
                device_id:
                  type: string
                  description: Optional device identifier
      responses:
        '200':
          description: Push token registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Push token registered successfully"
                  token_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/push/tokens/{token}:
    delete:
      summary: Deactivate push notification token
      description: Deactivate a push notification token when user logs out or uninstalls app
      tags: [Push Notifications]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Expo push token to deactivate
      responses:
        '200':
          description: Push token deactivated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Push token deactivated successfully"
        '500':
          $ref: '#/components/responses/InternalError'

  # Notifications
  /api/v1/notifications:
    get:
      summary: Get notifications
      description: Retrieve all notifications for the current user. By default returns all notifications (read and unread). Use ?unread=true to filter for unread notifications only.
      tags: [Notifications]
      parameters:
        - name: unread
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: If true, only return unread notifications. If false or omitted, return all notifications.
          example: true
      responses:
        '200':
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'

  /api/v1/notifications/clear:
    post:
      summary: Clear all notifications
      description: Marks all notifications as cleared for the current user
      tags: [Notifications]
      responses:
        '200':
          description: Notifications cleared successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/notifications/{alertid}/read:
    put:
      summary: Mark notification as read
      description: Mark a specific notification as read
      tags: [Notifications]
      parameters:
        - name: alertid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Notification ID
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Notification marked as read"
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/notifications/{alertid}:
    delete:
      summary: Dismiss notification
      description: Dismisses a specific notification
      tags: [Notifications]
      parameters:
        - name: alertid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Notification ID
      responses:
        '200':
          description: Notification dismissed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  # Badge Management
  /api/v1/badge:
    get:
      summary: Get badge count
      description: Returns the current badge count for the user (unread notifications, messages, etc.)
      tags: [Badge]
      responses:
        '200':
          description: Badge count retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count:
                            type: integer
                            example: 5
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/badge/refresh:
    post:
      summary: Refresh badge count
      description: Recalculates and returns the current badge count
      tags: [Badge]
      responses:
        '200':
          description: Badge count refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count:
                            type: integer
                            example: 5
        '500':
          $ref: '#/components/responses/InternalError'

  # Messaging - Threads
  /api/v1/threads:
    get:
      summary: Get all threads for current user
      description: Returns all message threads where the user is a participant, ordered by most recent activity
      tags: [Messaging]
      responses:
        '200':
          description: Threads retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Thread'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/threads/{threadid}/messages:
    get:
      summary: Get message history for a thread
      description: Returns all messages in a thread. User must be a participant to access messages.
      tags: [Messaging]
      parameters:
        - name: threadid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Thread ID
      responses:
        '200':
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '403':
          description: User is not a participant of this thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/threads/unread:
    get:
      summary: Get total unread message count
      description: Returns the total count of unread messages across all threads
      tags: [Messaging]
      responses:
        '200':
          description: Unread count retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count:
                            type: integer
                            example: 3
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/threads/message/{messageid}:
    get:
      summary: Get message by ID
      description: Retrieves a specific message by its ID
      tags: [Messaging]
      parameters:
        - name: messageid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Message ID
      responses:
        '200':
          description: Message retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/NotFound'

  # Nudges
  /api/v1/nudges:
    get:
      summary: Get nudges received
      description: Returns all nudges received by the current user
      tags: [Nudges]
      responses:
        '200':
          description: Nudges retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Nudge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/nudges/sent:
    get:
      summary: Get nudges sent
      description: Returns all nudges sent by the current user
      tags: [Nudges]
      responses:
        '200':
          description: Nudges retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Nudge'
        '500':
          $ref: '#/components/responses/InternalError'

  # Feedback
  /api/v1/feedback:
    post:
      summary: Submit feedback
      description: Submit user feedback about the application
      tags: [Feedback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: Feedback message
                type:
                  type: string
                  enum: [bug, feature, general]
                  description: Type of feedback
      responses:
        '201':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # WebSocket
  /api/v1/ws/messages/{threadid}:
    get:
      summary: WebSocket endpoint for thread-specific real-time messages
      tags: [WebSocket, Messaging]
      parameters:
        - name: threadid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Thread ID
      description: |
        Upgrade to WebSocket connection for thread-specific real-time messaging.

        **Connection Flow:**
        1. Client connects to websocket with thread ID
        2. Server verifies user is a participant
        3. Connection established to thread-specific room

        **Sending Messages:**
        Send JSON: `{"content": "Your message here"}`

        **Receiving Messages:**
        Receive JSON: `{"message_id": "uuid", "thread_id": "uuid", "user_id": "uuid", "content": "text", "created_at": "ISO8601"}`

        **Features:**
        - Messages are automatically persisted to database
        - Only participants in the thread receive broadcasts
        - Includes message ID and timestamp from database
      responses:
        '101':
          description: WebSocket connection established
        '401':
          description: Unauthorized - missing or invalid authentication
        '403':
          description: Forbidden - user is not a participant of this thread
        '400':
          description: Failed to upgrade to WebSocket

  /api/v1/ws/agent/{jobid}:
    get:
      summary: WebSocket endpoint for AI generation progress updates
      tags: [WebSocket, AI Agent]
      parameters:
        - name: jobid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Background job ID
      description: |
        Upgrade to WebSocket connection for real-time roadmap generation progress updates.

        **Connection Flow:**
        1. Client connects to websocket with job ID
        2. Server verifies job exists and belongs to user
        3. Server immediately sends current job status
        4. Connection remains open for progress updates

        **Receiving Progress Updates:**
        Receive JSON messages with format:
        ```json
        {
          "type": "progress|status|complete|error",
          "job_id": "uuid",
          "progress": 0-100,
          "status": "pending|processing|completed|failed",
          "message": "Human-readable status message",
          "data": {} // Additional context (e.g., roadmap_id when complete)
        }
        ```

        **Message Types:**
        - `status`: Initial status upon connection
        - `progress`: Progress update during generation (0-100%)
        - `complete`: Generation completed successfully (includes roadmap_id in data)
        - `error`: Generation failed (includes error message in data)

        **Ping/Pong:**
        Client can send `{"type": "ping"}` to keep connection alive.
        Server responds with `{"type": "pong"}`.

      responses:
        '101':
          description: WebSocket connection established
        '401':
          description: Unauthorized - missing or invalid authentication
        '404':
          description: Job not found or user not authorized
        '500':
          description: Failed to upgrade to WebSocket

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Invalid request format"
            status: 400

    Unauthorized:
      description: Unauthorized - authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Authentication required"
            status: 401

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Resource not found"
            status: 404

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Internal server error"
            status: 500

  schemas:
    # Base Response Types
    ApiResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: object
          description: Response data

    MessageResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: "Operation completed successfully"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        status:
          type: integer
          description: HTTP status code

    # User Management
    User:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        first_name:
          type: string
          example: "John"
        last_name:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        phone_number:
          type: string
          example: "+1-555-123-4567"
        profile_image_url:
          type: string
          format: uri
          example: "https://example.supabase.co/storage/v1/object/public/avatars/user-id/profile"
        CreatedAt:
          type: string
          format: date-time

    UserInput:
      type: object
      properties:
        first_name:
          type: string
          example: "John"
        last_name:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        phone_number:
          type: string
          example: "+1-555-123-4567"

    # Friend Management
    Friendship:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        requester_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        addressee_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174001"
        status:
          type: string
          enum: [pending, accepted, rejected, blocked]
          example: "pending"
        restrictions:
          type: object
          nullable: true
          description: JSONB object containing friendship restrictions
          properties:
            allowed_roadmap_ids:
              type: array
              items:
                type: string
                format: uuid
              example: ["roadmap-uuid-1", "roadmap-uuid-2"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        requester:
          $ref: '#/components/schemas/User'
          description: Requester user details (only when preloaded)
        addressee:
          $ref: '#/components/schemas/User'
          description: Addressee user details (only when preloaded)

    UserSearchResult:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        first_name:
          type: string
          example: "John"
        last_name:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        friendship_status:
          type: string
          enum: [none, pending, accepted]
          description: Current friendship status with this user
          example: "none"

    FriendResponse:
      type: object
      properties:
        friendship_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        friend:
          $ref: '#/components/schemas/User'
        restrictions:
          type: object
          nullable: true
          properties:
            allowed_roadmap_ids:
              type: array
              items:
                type: string
                format: uuid
        created_at:
          type: string
          format: date-time

    FriendProfileResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        allowed_roadmaps:
          type: array
          items:
            $ref: '#/components/schemas/Roadmap'
          description: Roadmaps where you are the accountability partner (anchor)

    # Anchor Management
    AnchorRequest:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        roadmap_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        requester_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
          description: User ID of the roadmap owner who sent the request
        anchor_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174001"
          description: User ID of the friend being asked to be the accountability partner
        status:
          type: string
          enum: [pending, accepted, rejected]
          example: "pending"
          description: Status of the anchor request
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: "2024-01-01T10:30:00Z"
        roadmap:
          $ref: '#/components/schemas/Roadmap'
          description: Associated roadmap details (when preloaded)
        requester:
          $ref: '#/components/schemas/User'
          description: Requester user details (when preloaded)
        anchor:
          $ref: '#/components/schemas/User'
          description: Anchor user details (when preloaded)

    # Roadmap Management
    Roadmap:
      type: object
      properties:
        roadmap_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        goal:
          type: string
          example: "Learn Full Stack Web Development"
        description:
          type: string
          example: "Comprehensive roadmap to become a full-stack developer"
        days:
          type: integer
          example: 180
        completed:
          type: boolean
          example: false
        start_date:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        type:
          type: string
          enum: [ai_generated, custom_made]
          default: custom_made
          description: |
            Type of roadmap:
            - `ai_generated`: Created by AI agent (always includes macro map)
            - `custom_made`: Manually created by user
          example: "ai_generated"
        anchor_id:
          type: string
          format: uuid
          nullable: true
          description: User ID of the accountability partner (anchor) for this roadmap
          example: "123e4567-e89b-12d3-a456-426614174000"
        current_skill_level:
          type: string
          description: User's current skill level for this roadmap goal
          example: "Beginner"
        macro_map:
          $ref: '#/components/schemas/MacroMap'
          description: Strategic overview of the roadmap (only present in ai_generated roadmaps)
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/Milestone'
          description: Detailed tactical milestones

    RoadmapInput:
      type: object
      properties:
        goal:
          type: string
          example: "Learn Full Stack Web Development"
        description:
          type: string
          example: "Comprehensive roadmap to become a full-stack developer"
        days:
          type: integer
          example: 180
        completed:
          type: boolean
          example: false
        start_date:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        type:
          type: string
          enum: [ai_generated, custom_made]
          default: custom_made
          description: Type of roadmap (defaults to custom_made if not specified)
          example: "custom_made"
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/MilestoneInput'

    # Milestone Management
    Milestone:
      type: object
      properties:
        milestone_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        roadmap_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        sub_goal:
          type: string
          example: "Learn Frontend Basics"
        description:
          type: string
          example: "Master HTML, CSS, and basic JavaScript"
        day:
          type: integer
          example: 30
        reached:
          type: boolean
          example: false
        date:
          type: string
          format: date-time
        macro_milestone_id:
          type: string
          format: uuid
          nullable: true
          description: Link to macro milestone if this is a detailed plan
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    MilestoneInput:
      type: object
      properties:
        sub_goal:
          type: string
          example: "Learn Frontend Basics"
        description:
          type: string
          example: "Master HTML, CSS, and basic JavaScript"
        day:
          type: integer
          example: 30
        reached:
          type: boolean
          example: false
        macro_milestone_id:
          type: string
          format: uuid
          nullable: true
          description: Link to macro milestone if this is a detailed plan
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskInput'

    # Task Management
    Task:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        roadmap_id:
          type: string
          format: uuid
