openapi: 3.0.3
info:
  title: DR Server API
  description: Goal tracking and roadmap management API with AI assistance
  version: 1.0.0
  contact:
    name: DR Server
    url: https://github.com/your-org/drserver
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.drserver.com
    description: Production server

security:
  - BearerAuth: []

paths:
  # Health Check
  /health:
    get:
      summary: Health check endpoint
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: dr-server

  /healthz:
    get:
      summary: Kubernetes health check
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # Friend Management
  /api/v1/friends/search:
    get:
      summary: Search users by email
      tags: [Friends]
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
          description: Email to search (partial match)
          example: "john@example.com"
      responses:
        '200':
          description: Search results with friendship status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserSearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/friends/requests:
    get:
      summary: Get pending friend requests
      description: Returns all pending friend requests received by the authenticated user
      tags: [Friends]
      responses:
        '200':
          description: Friend requests retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Friendship'

  /api/v1/friends/request/{id}:
    post:
      summary: Send friend request
      tags: [Friends]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Target user ID to send friend request to
      responses:
        '201':
          description: Friend request sent successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Friendship'
        '400':
          description: Invalid request (e.g., trying to friend yourself)
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Friend request already exists or users are already friends

  /api/v1/friends/{id}:
    patch:
      summary: Update friend request status
      description: Accept or reject a pending friend request (only addressee can update)
      tags: [Friends]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Friendship ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [accepted, rejected]
                  description: New status for the friend request
                  example: "accepted"
      responses:
        '200':
          description: Friend request status updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Friendship'
        '400':
          description: Invalid status or request is not pending
        '403':
          description: Only the addressee can respond to a friend request
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Remove friendship
      description: Delete friendship between you and the specified user
      tags: [Friends]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Friend's user ID
      responses:
        '200':
          description: Friendship removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/friends:
    get:
      summary: Get list of friends
      description: Returns all accepted friendships with friend profile information
      tags: [Friends]
      responses:
        '200':
          description: Friends list retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FriendResponse'

  /api/v1/friends/{id}/profile:
    get:
      summary: Get friend's profile with anchored roadmaps
      description: Returns friend's profile and roadmaps where you are the accountability partner (anchor)
      tags: [Friends]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Friend's user ID
      responses:
        '200':
          description: Friend profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FriendProfileResponse'
        '403':
          description: You are not friends with this user

  # User Management
  /api/v1/users:
    post:
      summary: Create or update user (upsert)
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User created or updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      summary: Get current user
      tags: [Users]
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/search:
    get:
      summary: Search users by email
      description: Search for users by email (partial match). For friend-related searches with friendship status, use /api/v1/friends/search instead.
      tags: [Users]
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
          description: Email to search (partial match)
          example: "john@example.com"
      responses:
        '200':
          description: Users found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/users/{id}:
    patch:
      summary: Update user by ID
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Delete user by ID
      description: Deletes the user and their profile image from storage
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/with-image:
    post:
      summary: Create user with profile image
      description: Creates a new user with an optional profile image. Uses multipart/form-data.
      tags: [Users]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - user
              properties:
                user:
                  type: string
                  description: JSON string of user data
                  example: '{"first_name": "John", "last_name": "Doe", "email": "john@example.com"}'
                image:
                  type: string
                  format: binary
                  description: Profile image file
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/{id}/with-image:
    patch:
      summary: Update user with profile image
      description: Updates a user with an optional profile image. Uses multipart/form-data.
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - user
              properties:
                user:
                  type: string
                  description: JSON string of user data
                  example: '{"first_name": "John", "last_name": "Doe"}'
                image:
                  type: string
                  format: binary
                  description: Profile image file
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/{id}/image:
    delete:
      summary: Delete user's profile image
      description: Removes the user's profile image from storage and clears the URL from their profile
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      responses:
        '200':
          description: Profile image deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # Roadmap Management
  /api/v1/roadmaps:
    post:
      summary: Create a new roadmap
      tags: [Roadmaps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadmapInput'
      responses:
        '201':
          description: Roadmap created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Roadmap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      summary: Get all roadmaps for current user
      tags: [Roadmaps]
      responses:
        '200':
          description: Roadmaps retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Roadmap'

  /api/v1/roadmaps/{roadmapid}:
    get:
      summary: Get specific roadmap with optional view filter
      description: |
        Retrieve a roadmap with different levels of detail:
        - `full` (default): Both macro map (strategic) and milestones (tactical)
        - `macro`: Only the macro map (high-level phases and macro milestones)
        - `milestones`: Only detailed milestones and tasks
      tags: [Roadmaps]
      parameters:
        - name: roadmapid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Roadmap ID
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: [full, macro, milestones]
            default: full
          description: |
            Which data to include in response:
            - `full`: Both macro map and milestones (default)
            - `macro`: Only macro map (strategic view)
            - `milestones`: Only detailed milestones (tactical view)
      responses:
        '200':
          description: Roadmap retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Roadmap'
        '400':
          description: Invalid view parameter
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update roadmap
      tags: [Roadmaps]
      parameters:
        - name: roadmapid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Roadmap ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadmapInput'
      responses:
        '200':
          description: Roadmap updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Roadmap'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Delete roadmap
      tags: [Roadmaps]
      parameters:
        - name: roadmapid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Roadmap ID
      responses:
        '200':
          description: Roadmap deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/roadmaps/{roadmapid}/start:
    put:
      summary: Start a roadmap
      description: Marks a roadmap as started and initializes task statuses
      tags: [Roadmaps]
      parameters:
        - name: roadmapid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Roadmap ID
      responses:
        '200':
          description: Roadmap started successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Roadmap'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/roadmaps/{roadmapid}/nudge:
    post:
      summary: Nudge roadmap owner
      description: Sends a nudge notification from the anchor to the roadmap owner
      tags: [Roadmaps, Nudges]
      parameters:
        - name: roadmapid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Roadmap ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: Optional message to include with the nudge
      responses:
        '200':
          description: Nudge sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Only the anchor can nudge the roadmap owner
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/roadmaps/{roadmapid}/milestones:
    get:
      summary: Get milestones for a roadmap
      tags: [Roadmaps, Milestones]
      parameters:
        - name: roadmapid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Roadmap ID
      responses:
        '200':
          description: Milestones retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Milestone'

    post:
      summary: Create milestone in roadmap
      tags: [Roadmaps, Milestones]
      parameters:
        - name: roadmapid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Roadmap ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneInput'
      responses:
        '201':
          description: Milestone created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Milestone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # Milestone Management
  /api/v1/milestones/{milestoneid}:
    get:
      summary: Get specific milestone
      tags: [Milestones]
      parameters:
        - name: milestoneid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Milestone ID
      responses:
        '200':
          description: Milestone retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Milestone'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update milestone
      tags: [Milestones]
      parameters:
        - name: milestoneid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Milestone ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneInput'
      responses:
        '200':
          description: Milestone updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Milestone'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Delete milestone
      tags: [Milestones]
      parameters:
        - name: milestoneid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Milestone ID
      responses:
        '200':
          description: Milestone deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/milestones/{milestoneid}/tasks:
    get:
      summary: Get tasks for a milestone
      tags: [Milestones, Tasks]
      parameters:
        - name: milestoneid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Milestone ID
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'

  # Task Management
  /api/v1/tasks:
    post:
      summary: Create a new task
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/user:
    get:
      summary: Get tasks for current user with optional filters
      tags: [Tasks]
      parameters:
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter tasks by start date (format YYYY-MM-DD)
          example: "2024-01-01"
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter tasks by end date (format YYYY-MM-DD). Used with start_date for range filtering.
          example: "2024-01-31"
        - name: roadmap_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter tasks by roadmap ID
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'

  /api/v1/tasks/{taskid}:
    get:
      summary: Get specific task
      tags: [Tasks]
      parameters:
        - name: taskid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task ID
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update task
      tags: [Tasks]
      parameters:
        - name: taskid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Delete task
      tags: [Tasks]
      parameters:
        - name: taskid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task ID
      responses:
        '200':
          description: Task deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  # Step Management
  /api/v1/tasks/{taskid}/steps:
    post:
      summary: Create step in task
      tags: [Tasks, Steps]
      parameters:
        - name: taskid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task ID
      requestBody:
        required: true
        content:
