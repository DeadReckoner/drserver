name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # tidy, fmt, build, test (with coverage), clean — matches local `make ci`
      - run: make ci

      # Fail if `go mod tidy` or `go fmt` changed anything: keeps go.mod/go.sum
      # and formatting honest at PR time instead of drifting silently.
      - name: Check for tidy/fmt drift
        run: git diff --exit-code

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # GitHub-hosted ubuntu runners ship a running Docker daemon, so
      # testcontainers can start the throwaway Postgres on its own. The
      # `integration` build tag gates these tests; the unit job never
      # compiles them.
      - name: Run integration suite
        run: make integration_test
