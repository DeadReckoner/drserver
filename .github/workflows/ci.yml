name: CI

on: [push, pull_request]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - uses: golangci/golangci-lint-action@v6
              continue-on-error: true

            - name: Run CI
              run: make ci
